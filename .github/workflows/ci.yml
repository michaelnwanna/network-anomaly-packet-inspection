name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal conformance)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Build a standalone binary
        run: CGO_ENABLED=0 go build -trimpath -o bin/traceglass ./cmd/traceglass
      - name: Executable conformance
        run: |
          export TRACEGLASS_CONFORMANCE_COMMAND="[\"$GITHUB_WORKSPACE/bin/traceglass\"]"
          go test -race ./conformance -count=1 -v -timeout=180s
      - uses: actions/upload-artifact@v4
        if: matrix.go == 'stable'
        with:
          name: traceglass-linux-amd64
          path: bin/traceglass
